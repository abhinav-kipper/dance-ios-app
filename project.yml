name: Repaso
options:
  bundleIdPrefix: com.amudgal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: SMXLJ42Z9D   # Abhinav Mudgal (Personal Team); replace with the paid team ID for TestFlight
    CODE_SIGN_STYLE: Automatic
packages:
  RepasoCore:
    path: Packages/RepasoCore
targets:
  Repaso:
    type: application
    platform: iOS
    sources: [Repaso]
    dependencies:
      - package: RepasoCore
      - target: RepasoShare
    entitlements:
      path: Repaso/Resources/Repaso.entitlements
      properties:
        com.apple.security.application-groups: [group.com.amudgal.repaso]
    info:
      path: Repaso/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repaso
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # All orientations listed so iOS 26 multitasking checks pass; the app delegate keeps it portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: "Repaso imports your class videos so you can cut and practice clips, and removes them from Photos after import when you ask."
        ITSAppUsesNonExemptEncryption: false
        # The Share extension opens repaso://inbox once a shared video is in the App Group inbox.
        CFBundleURLTypes:
          - CFBundleURLName: com.amudgal.repaso
            CFBundleURLSchemes: [repaso]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amudgal.repaso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepasoShare:
    type: app-extension
    platform: iOS
    sources: [RepasoShare]
    dependencies:
      - package: RepasoCore
    entitlements:
      path: RepasoShare/RepasoShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.amudgal.repaso]
    info:
      path: RepasoShare/Info.plist
      properties:
        CFBundleDisplayName: Repaso
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amudgal.repaso.share
  RepasoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RepasoUITests]
    dependencies:
      - target: Repaso
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.amudgal.repaso.uitests
schemes:
  Repaso:
    build:
      targets:
        Repaso: all
    test:
      targets:
        - RepasoUITests
        - package: RepasoCore/RepasoCoreTests
