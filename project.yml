name: Repaso
options:
  bundleIdPrefix: com.amudgal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: SMXLJ42Z9D   # Abhinav Mudgal (Personal Team); replace with the paid team ID for TestFlight
    CODE_SIGN_STYLE: Automatic
packages:
  RepasoCore:
    path: Packages/RepasoCore
targets:
  Repaso:
    type: application
    platform: iOS
    sources: [Repaso]
    dependencies:
      - package: RepasoCore
    info:
      path: Repaso/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repaso
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # All orientations listed so iOS 26 multitasking checks pass; the app delegate keeps it portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: "Repaso imports your class videos so you can cut and practice clips, and removes them from Photos after import when you ask."
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.amudgal.repaso.drag-ref
            UTTypeDescription: Repaso item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amudgal.repaso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepasoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RepasoUITests]
    dependencies:
      - target: Repaso
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.amudgal.repaso.uitests
schemes:
  Repaso:
    build:
      targets:
        Repaso: all
    test:
      targets:
        - RepasoUITests
        - package: RepasoCore/RepasoCoreTests
